# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀
bind = SUPER,x,exec,d-power
# bind = SUPER,period,exec,d-dict
bind = SUPERSHIFT,b,exec,d-bookmark
bind = SUPER,w,exec,d-urls

bind = SUPER, y, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy

bind = SUPER,Delete,exec,pkill -INT wl-screenrec && pkill -RTMIN+8 waybar

bind = CONTROL,F1,exec,hyprctl dispatch dpms on
bind = SUPER,F5,exec,d-walls
bind = SUPER,F8,exec,mpv --untimed --geometry = 35%-30-30 --no-cache --no-osc --no-input-default-bindings --profile = low-latency --input-conf = /dev/null --title = webcam $(ls /dev/video[0,2,4,6,8] | tail -n 1)
bind = SUPER,F11,exec,d-mpdplay

# to zoom/magnify the screen
bind = SUPERSHIFT, equal, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 + 1}')"
bind = SUPERSHIFT, minus, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 - 1}')"
bind = SUPERSHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 + 1}')"
bind = SUPERSHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 - 1}')"

# to scale the screen
bind = SUPER, 0, exec, hyprctl keyword monitor ,2880x1800@90,auto,1.5
bind = SUPERSHIFT, 0, exec, hyprctl keyword monitor ,2880x1800@90,auto,1



# █▀ █▀▀ █▀█ █▀▀ █▀▀ █▄░█ █▀ █░█ █▀█ ▀█▀
